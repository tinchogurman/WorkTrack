name: Windows checks and build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Test
        run: python -m pytest -q -p no:cacheprovider
      - name: Build Windows application
        run: |
          python tools/make_icon.py
          python -m PyInstaller WorkTrack.spec --noconfirm --clean
      - name: Package application
        shell: pwsh
        run: |
          Compress-Archive -Path dist/WorkTrack -DestinationPath WorkTrack-Windows.zip
          (Get-FileHash WorkTrack-Windows.zip -Algorithm SHA256).Hash.ToLower() + '  WorkTrack-Windows.zip' | Set-Content -Encoding ascii SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: WorkTrack-Windows
          path: |
            WorkTrack-Windows.zip
            SHA256SUMS.txt
          retention-days: 30
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: windows
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: WorkTrack-Windows
      - name: Publish tagged release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "$env:GITHUB_REF_NAME" WorkTrack-Windows.zip SHA256SUMS.txt --title "WorkTrack $env:GITHUB_REF_NAME" --notes "Aplicación de escritorio para Windows 10/11. Descargá WorkTrack-Windows.zip, extraé toda la carpeta y ejecutá WorkTrack.exe. Los datos se guardan localmente en %APPDATA%\WorkTrack."
